name: ui

# エミュレータ（API 34、x86_64）の androidTest とスクリーンショット（docs/02 §18）。
# android.yml とは別のワークフローにして、Implementer の連続 push で実行中のジョブが取り消されないようにする
# （concurrency は cancel-in-progress: false。実行中のものは最後まで走り、待ちは最新の 1 件だけ残る）。
# 最初は継続ジョブ扱い（失敗しても android ワークフローの成否には影響しない）。2 回連続で緑になったら必須にする。

on:
  push:
    branches-ignore:
      - qa-screenshots
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    permissions:
      contents: write # qa-screenshots ブランチへ画像を追記するため（このジョブだけ）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-v1
      - name: Create AVD and generate the snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run androidTest on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run-ui-tests.sh
      - name: Publish screenshots to the qa-screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/publish-screenshots.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-out/screenshots
          retention-days: 14
          if-no-files-found: warn
      - name: Upload logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-logs
          path: ui-out/logs
          retention-days: 7
          if-no-files-found: warn

