name: ui

# エミュレータ（API 34、x86_64）の androidTest とスクリーンショット（docs/02 §18）。
# android.yml とは別のワークフローにして、Implementer の連続 push で実行中のジョブが取り消されないようにする
# （concurrency は cancel-in-progress: false。実行中のものは最後まで走り、待ちは最新の 1 件だけ残る）。
# 別ワークフローなので、失敗しても android ワークフローの成否には影響しない（ジョブは正直に赤になる）。2 回連続で緑になったら必須にする。

on:
  push:
    branches-ignore:
      - qa-screenshots
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write # qa-screenshots ブランチへ画像を追記するため（このジョブだけ）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # システムイメージのダウンロードが一時的に壊れる（"Error on ZipFile unknown archive"）ことがあるので、先に再試行つきで入れる
      - name: Install the emulator system image (with retries)
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3 4; do
            if "$sdk" --install 'platform-tools' 'emulator' 'platforms;android-34' 'system-images;android-34;google_apis;x86_64' > sdk-install.log 2>&1 \
              && ! grep -qi "error" sdk-install.log; then
              echo "installed on attempt $i"
              exit 0
            fi
            echo "attempt $i failed:"; tail -5 sdk-install.log
            rm -rf "$ANDROID_HOME/system-images/android-34" || true
            sleep $((i * 10))
          done
          echo "::warning::could not pre-install the system image; the emulator action will try again"
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-pixel6-v2
      - name: Create AVD and generate the snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run androidTest on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run-ui-tests.sh
      - name: Publish screenshots to the qa-screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/publish-screenshots.sh
      - name: Job summary
        if: always()
        run: |
          {
            echo "## ui: androidTest on the emulator"
            echo "job status: \`${{ job.status }}\`"
            echo '```'
            cat ui-out/result.txt 2>/dev/null || echo "(no result.txt: the test step did not run)"
            echo '```'
            echo "screenshots: $(find ui-out/screenshots -type f 2>/dev/null | wc -l) file(s); published to the qa-screenshots branch (runs/${{ github.run_number }}-*)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-out/screenshots
          retention-days: 14
          if-no-files-found: warn
      - name: Upload logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-logs
          path: ui-out/logs
          retention-days: 7
          if-no-files-found: warn

