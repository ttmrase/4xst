name: android

on:
  push:
    branches-ignore:
      - qa-screenshots
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and coverage (:core, :ai)
        run: ./gradlew :core:test :ai:test ktlintCheck koverXmlReport :core:koverVerify :ai:koverVerify -PwithAndroid=false
      # docs/04 §1: 実決済 SDK を持たない。依存グラフ（:core / :ai）とソース・マニフェスト・ビルド定義を検査する。
      - name: No billing dependencies (:core, :ai)
        run: |
          .github/scripts/check-no-billing.sh :core runtimeClasspath -PwithAndroid=false
          .github/scripts/check-no-billing.sh :ai runtimeClasspath -PwithAndroid=false
      - name: No billing SDK or permission references
        run: .github/scripts/check-no-billing-refs.sh
      - name: No payment brand names
        run: .github/scripts/check-no-payment-brands.sh
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            core/build/reports
            ai/build/reports
          retention-days: 7

  apk:
    needs: jvm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest には Android SDK が同梱（ANDROID_HOME）。setup-android は `sdkmanager tools` で失敗したため使わない。
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: No billing dependencies (:app)
        run: |
          .github/scripts/check-no-billing.sh :app debugRuntimeClasspath -PwithAndroid=true
          .github/scripts/check-no-billing.sh :app releaseRuntimeClasspath -PwithAndroid=true
      - name: Build debug APK, unit tests, lint and ktlint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:ktlintCheck -PwithAndroid=true
      - name: No billing in merged manifest and APK permissions
        run: .github/scripts/check-apk-no-billing.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crownfall-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      # リリース APK: Secrets（4 つ全て）がある時だけ本番鍵で署名。無ければ固定 debug 鍵の署名（名前も別にして取り違えを防ぐ）。
      # Secret の値は出力しない（::add-mask:: とファイル経由。set -x を使わない）。
      - name: Prepare release signing (only when all Secrets exist)
        id: signing
        env:
          B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          SP: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KA: ${{ secrets.RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$B64" && -n "$SP" && -n "$KA" && -n "$KP" ]]; then
            for v in "$SP" "$KA" "$KP"; do echo "::add-mask::$v"; done
            ks="$RUNNER_TEMP/release.keystore"
            printf '%s' "$B64" | base64 -d > "$ks"
            chmod 600 "$ks"
            {
              echo "RELEASE_KEYSTORE_PATH=$ks"
              echo "RELEASE_STORE_PASSWORD=$SP"
              echo "RELEASE_KEY_ALIAS=$KA"
              echo "RELEASE_KEY_PASSWORD=$KP"
            } >> "$GITHUB_ENV"
            echo "signed=release" >> "$GITHUB_OUTPUT"
            echo "Release signing: production key is available"
          else
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "Release signing: Secrets are absent; the release APK is signed with the fixed debug key"
          fi
      - name: Build release APK
        run: ./gradlew :app:assembleRelease -PwithAndroid=true
      - name: Name the release APK and check billing and signature
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          src=app/build/outputs/apk/release/app-release.apk
          if [[ "$SIGNED" == "release" ]]; then out=crownfall-release.apk; else out=crownfall-release-debugsigned.apk; fi
          mkdir -p dist
          cp "$src" "dist/$out"
          .github/scripts/check-apk-no-billing.sh "dist/$out"
          # 02 §18: release は arm64-v8a だけ（x86_64 は debug のエミュレータ用だけ）。lib/ の ABI を確認する
          abis_of() { unzip -Z1 "$1" | grep '^lib/' | cut -d/ -f2 | sort -u | tr '\n' ' '; }
          release_abis="$(abis_of "dist/$out")"
          echo "::notice title=APK native ABIs::debug=[$(abis_of app/build/outputs/apk/debug/app-debug.apk)] release=[$release_abis]"
          if [[ -n "${release_abis// /}" && "${release_abis// /}" != "arm64-v8a" ]]; then
            echo "::error::release APK has unexpected ABIs: $release_abis"
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "== debug APK certificate =="
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E 'SHA-256|Signer #1 certificate DN'
          echo "== $out certificate =="
          "$apksigner" verify --print-certs "dist/$out" | grep -E 'SHA-256|Signer #1 certificate DN'
          "$apksigner" verify "dist/$out"
          sha() { "$apksigner" verify --print-certs "$1" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1; }
          d="$(sha app/build/outputs/apk/debug/app-debug.apk)"
          r="$(sha "dist/$out")"
          echo "::notice title=APK signing certificates::debug=$d / $out=$r"
          # app/debug.keystore の公開証明書（固定）。変わると上書きインストールが失敗する。
          expected_debug=83bab479344f752e592c4e6d5d1454743ca9cd16cec5cde278afb74e535396b0
          if [[ "$d" != "$expected_debug" ]]; then echo "::error::debug certificate changed: $d"; exit 1; fi
          if [[ "$SIGNED" != "release" && "$r" != "$d" ]]; then echo "::error::debug-signed release APK does not use the debug key"; exit 1; fi
      - name: APK sizes
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          size() { stat -c %s "$1"; }
          d="$(size app/build/outputs/apk/debug/app-debug.apk)"
          r="$(size dist/crownfall-release*.apk)"
          echo "::notice title=APK sizes::debug=$((d / 1024)) KiB, release=$((r / 1024)) KiB"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: crownfall-release-apk
          path: dist/crownfall-release*.apk
          retention-days: 14
          if-no-files-found: error
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-lint-reports
          path: app/build/reports
          retention-days: 7
