name: android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and coverage (:core, :ai)
        run: ./gradlew :core:test :ai:test ktlintCheck koverXmlReport -PwithAndroid=false
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            core/build/reports
            ai/build/reports
          retention-days: 7

  apk:
    needs: jvm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK, lint and ktlint
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:ktlintCheck -PwithAndroid=true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crownfall-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-lint-reports
          path: app/build/reports
          retention-days: 7
